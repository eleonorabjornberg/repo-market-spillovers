# The watch (study 07): rebuild the public page monthly from fresh data and publish it to GitHub Pages.
# Runs on the 3rd of each month, after month-end data has been published; can also be run by hand.
name: watch

on:
  schedule:
    - cron: "17 13 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch data and build the page
        run: |
          python scripts/watch.py
          python scripts/build_findings.py
      - name: Commit this month's readings
        run: |
          git config user.name "repo-market-watch"
          git config user.email "repo-market-watch@users.noreply.github.com"
          git add results/watch results/study-10 site/index.html site/findings.html
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Watch: monthly readings ($(date -u +%Y-%m-%d))"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
