# The watch (study 07): rebuild the public page weekly from fresh data and publish it to GitHub Pages.
# Runs every Monday; can also be run by hand. Flags score the last complete month and are re-scored each week until
# the next month ends, so a month's row in results/watch/flags_history.csv settles once its late data is in.
name: watch

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch data and build the page
        run: |
          python scripts/study_21_reserves_gauge.py
          python scripts/watch.py
          python scripts/study_18_year_end_2026.py
          python scripts/build_findings.py
      - name: Commit this week's readings
        run: |
          git config user.name "repo-market-watch"
          git config user.email "repo-market-watch@users.noreply.github.com"
          git add results/watch results/study-10 results/study-18 results/study-21 site
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Watch: weekly readings ($(date -u +%Y-%m-%d))"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
